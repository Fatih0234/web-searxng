services:
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.8.19-5ffd32ca2}
    container_name: webx-searxng
    ports:
      - "127.0.0.1:8888:8080"
    env_file:
      - .env
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./cache:/var/cache/searxng
    restart: "no"
