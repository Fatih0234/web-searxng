[project]
name = "webx"
version = "0.1.0"
description = "Local on-demand web search for coding agents — SearXNG + controlled page reader"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "webx" }]
keywords = ["search", "searxng", "mcp", "web", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "httpx>=0.28,<1",
  "trafilatura>=2.2,<3",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-asyncio>=0.24",
]

[project.scripts]
webx = "webx.cli:main"
webx-mcp = "webx.mcp_server:main"

[project.urls]
Homepage = "https://github.com/example/webx"
Issues = "https://github.com/example/webx/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webx"]

[tool.hatch.build.targets.wheel.force-include]
"src/webx/assets" = "webx/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: live integration tests requiring Docker/SearXNG or public net",
]

[tool.coverage.run]
source = ["webx"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
